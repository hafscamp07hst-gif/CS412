{% extends 'mini_insta/base.html' %}
<!--

Description: Display the image and all profile information for one user.
-->

{% block content %}
<h2>{{ profile.display_name }}</h2>
{% if profile.profile_image_url %}
<img class="profile-image" src="{{ profile.profile_image_url }}" alt="{{ profile.display_name }}">
{% endif %}
<table>
    <tr>
        <th>Username</th>
        <td>@{{ profile.username }}</td>
    </tr>
    <tr>
        <th>Display Name</th>
        <td>{{ profile.display_name }}</td>
    </tr>
    <tr>
        <th>Bio</th>
        <td class="bio-text">{{ profile.bio_text }}</td>
    </tr>
    <tr>
        <th>Join Date</th>
        <td>{{ profile.join_date }}</td>
    </tr>
</table>
{% endblock %}
