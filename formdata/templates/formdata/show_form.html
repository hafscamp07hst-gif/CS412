<!-- formdata/templates/formdata/form.html -->
{% extends 'formdata/base.html' %}
 
 
{% block content %}
<div>
<h1>Contact Form</h1>
 
 
<form action="{% url 'submit' %}" method ='POST'>
    {% csrf_token %}
    <label for ='name' class="name">Name:</label>
    <input type="text" name="name">
    <label for ="favorite_color" class = "favorite_color">Favorite color:</label>
    <input type="text" name="favorite_color" id="favorite_color">
    <input type="submit">
 
 
</form>
</div>
{% endblock %}
